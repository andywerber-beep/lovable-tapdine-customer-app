# Build the TapDine Android app in the cloud.
# Produces:
#   - TapDine-release.aab  → upload to Google Play Console
#   - TapDine-test.apk     → install directly on an Android phone for testing
#
# Optional GitHub repository secrets (Settings → Secrets and variables → Actions)
# for a Play-ready signed bundle. Without them, you still get a debug-signed
# test APK, and the .aab is left unsigned (Play will reject an unsigned one).
#   ANDROID_KEYSTORE_BASE64    – your upload keystore (.jks) encoded with: base64 -i upload.jks
#   ANDROID_KEYSTORE_PASSWORD  – keystore password
#   ANDROID_KEY_ALIAS          – key alias inside the keystore
#   ANDROID_KEY_PASSWORD       – key password
#
# Trigger: GitHub → Actions → "Build Android (AAB + test APK)" → Run workflow.
# Download results from the run's "Artifacts" section.

name: Build Android (AAB + test APK)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # ubuntu-latest runners already ship the full Android SDK here.
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: oven-sh/setup-bun@v2

      - name: Accept Android SDK licenses & install ImageMagick
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install dependencies
        run: bun install

      # Hosted-webview mode: the app loads the live site, so dist/ only needs a placeholder.
      - name: Prepare web placeholder
        run: |
          mkdir -p dist
          echo '<!doctype html><html><body>TapDine</body></html>' > dist/index.html

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android
          ls -la android/app

      - name: Bundle TapDine app icon
        run: |
          RES=android/app/src/main/res
          # Use the plain PNG icon on every Android version.
          rm -rf "$RES/mipmap-anydpi-v26"
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            mkdir -p "$RES/mipmap-$d"
            convert public/app-store-icon-1024.png -resize ${s}x${s} "$RES/mipmap-$d/ic_launcher.png"
            cp "$RES/mipmap-$d/ic_launcher.png" "$RES/mipmap-$d/ic_launcher_round.png"
            cp "$RES/mipmap-$d/ic_launcher.png" "$RES/mipmap-$d/ic_launcher_foreground.png"
          done

      - name: Add location & notification permissions and version
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for p in ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION POST_NOTIFICATIONS; do
            grep -q "android.permission.$p" "$MANIFEST" || \
              sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$p\" />\n</manifest>#" "$MANIFEST"
          done
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build test APK (debug-signed)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release App Bundle
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Strip whitespace / CR / trailing newlines pasted into secrets.
          clean() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          KEYSTORE_B64=$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')
          KEYSTORE_PASSWORD=$(clean "$KEYSTORE_PASSWORD")
          KEY_ALIAS=$(clean "$KEY_ALIAS")
          KEY_PASSWORD=$(clean "$KEY_PASSWORD")

          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — building an UNSIGNED .aab. Add the keystore secrets before uploading to Google Play."
            ./gradlew bundleRelease --no-daemon
            exit 0
          fi

          KS="$RUNNER_TEMP/upload.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"

          # 1. Store password must open the keystore.
          if ! keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD cannot open the keystore (or ANDROID_KEYSTORE_BASE64 is corrupted)."
            exit 1
          fi

          # 2. Verify alias; auto-detect from the keystore if it doesn't match.
          ALIASES=$(keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
            | grep -i 'PrivateKeyEntry' | cut -d',' -f1 | sed 's/[[:space:]]*$//')
          if [ -z "$KEY_ALIAS" ] || ! printf '%s\n' "$ALIASES" | grep -qxF "$KEY_ALIAS"; then
            DETECTED=$(printf '%s\n' "$ALIASES" | head -n1)
            if [ -z "$DETECTED" ]; then
              echo "::error::No private key entry found in the keystore."; exit 1
            fi
            echo "::warning::ANDROID_KEY_ALIAS not found in keystore — using detected alias instead."
            KEY_ALIAS="$DETECTED"
          fi

          # 3. Test private-key recovery (certreq needs the key itself).
          can_recover() {
            [ -n "$1" ] && keytool -certreq -alias "$KEY_ALIAS" -keystore "$KS" \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$1" >/dev/null 2>&1
          }
          if can_recover "$KEY_PASSWORD"; then
            echo "Key password verified."
          elif can_recover "$KEYSTORE_PASSWORD"; then
            echo "::warning::ANDROID_KEY_PASSWORD empty or wrong — falling back to ANDROID_KEYSTORE_PASSWORD."
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
          else
            echo "::error::Cannot recover the private key with ANDROID_KEY_PASSWORD or ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi

          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$KS" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Collect outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/TapDine-test.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/TapDine-release.aab
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: TapDine-android-${{ github.run_number }}
          path: out/

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
