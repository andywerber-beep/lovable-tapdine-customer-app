# Build the TapDine iOS app in the cloud and upload it to TestFlight.
# No Mac or Xcode needed — see IOS_BUILD_GUIDE.md for the secrets to add.
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#   APP_STORE_CONNECT_ISSUER_ID    – Issuer ID shown on App Store Connect → Users and Access → Integrations → Keys
#   APP_STORE_CONNECT_KEY_ID       – Key ID of the API key you created (e.g. 2X9R4HXF34)
#   APP_STORE_CONNECT_PRIVATE_KEY  – Full contents of the downloaded AuthKey_XXXX.p8 file (including BEGIN/END lines)
#   APPLE_TEAM_ID                  – Your 10-character Apple Developer Team ID
#
# Trigger: GitHub → Actions → "Build iOS & upload to TestFlight" → Run workflow.

name: Build iOS & upload to TestFlight

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Use latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # Hosted-webview mode: the app loads the live site, so dist/ only needs a placeholder.
      - name: Prepare web placeholder
        run: |
          mkdir -p dist
          echo '<!doctype html><html><body>TapDine</body></html>' > dist/index.html

      - name: Add iOS platform
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Add permission texts and build number
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'TapDine uses your location to show live food deals near you.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true

      - name: Write and check App Store Connect API key
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in PRIVATE_KEY KEY_ID ISSUER_ID TEAM_ID; do
            [ -n "${!v}" ] || { echo "::error::Missing secret for $v"; exit 1; }
          done
          [ ${#TEAM_ID} -eq 10 ] || { echo "::error::APPLE_TEAM_ID must be 10 characters"; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys"
          KEYFILE="$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          # Accept keys pasted with real newlines or with literal \n sequences.
          printf '%b\n' "$PRIVATE_KEY" | tr -d '\r' > "$KEYFILE"
          grep -q "BEGIN PRIVATE KEY" "$KEYFILE" || { echo "::error::Private key must include the BEGIN/END PRIVATE KEY lines"; exit 1; }
          openssl pkey -in "$KEYFILE" -noout || { echo "::error::Private key is not a valid .p8 file"; exit 1; }

      # Archive WITHOUT signing. The CI machine has no Apple account or
      # development profile, which caused "No Account for Team". Signing
      # happens in the export step using Apple's cloud-managed distribution
      # certificate via the API key.
      - name: Archive (unsigned)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TapDine.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER=app.tapdine.diner \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Export & upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TapDine.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Clean up key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
