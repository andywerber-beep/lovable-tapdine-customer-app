# Build the TapDine iOS app in the cloud and upload it to TestFlight.
# No Mac or Xcode needed — see IOS_BUILD_GUIDE.md for the secrets to add.
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#   APP_STORE_CONNECT_ISSUER_ID    – Issuer ID shown on App Store Connect → Users and Access → Integrations → Keys
#   APP_STORE_CONNECT_KEY_ID       – Key ID of the API key you created (e.g. 2X9R4HXF34)
#   APP_STORE_CONNECT_PRIVATE_KEY  – Full contents of the downloaded AuthKey_XXXX.p8 file (including BEGIN/END lines)
#   APPLE_TEAM_ID                  – Your 10-character Apple Developer Team ID
#
# Trigger: GitHub → Actions → "Build iOS & upload to TestFlight" → Run workflow.

name: Build iOS & upload to TestFlight

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Use latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # Hosted-webview mode: the app loads the live site, so dist/ only needs a placeholder.
      - name: Prepare web placeholder
        run: |
          mkdir -p dist
          echo '<!doctype html><html><body>TapDine</body></html>' > dist/index.html

      - name: Add iOS platform
        run: |
          npx cap add ios
          npx cap sync ios
          # Create a shared App scheme so headless xcodebuild sees iOS buildables.
          SCHEME_DIR=ios/App/App.xcodeproj/xcshareddata/xcschemes
          mkdir -p "$SCHEME_DIR"
          cat > "$SCHEME_DIR/App.xcscheme" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion = "1500" version = "1.7">
             <BuildAction parallelizeBuildables = "YES" buildImplicitDependencies = "YES">
                <BuildActionEntries>
                   <BuildActionEntry buildForTesting = "YES" buildForRunning = "YES" buildForProfiling = "YES" buildForArchiving = "YES" buildForAnalyzing = "YES">
                      <BuildableReference BuildableIdentifier = "primary" BlueprintIdentifier = "504EC3031FED79650016851F" BuildableName = "App.app" BlueprintName = "App" ReferencedContainer = "container:App.xcodeproj">
                      </BuildableReference>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
             <TestAction buildConfiguration = "Debug" selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB" shouldUseLaunchSchemeArgsEnv = "YES">
             </TestAction>
             <LaunchAction buildConfiguration = "Debug" selectedDebuggerIdentifier = "Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier = "Xcode.DebuggerFoundation.Launcher.LLDB" launchStyle = "0" useCustomWorkingDirectory = "NO" ignoresPersistentStateOnLaunch = "NO" debugDocumentVersioning = "YES" debugServiceExtension = "internal" allowLocationSimulation = "YES">
                <BuildableProductRunnable runnableDebuggingMode = "0">
                   <BuildableReference BuildableIdentifier = "primary" BlueprintIdentifier = "504EC3031FED79650016851F" BuildableName = "App.app" BlueprintName = "App" ReferencedContainer = "container:App.xcodeproj">
                   </BuildableReference>
                </BuildableProductRunnable>
             </LaunchAction>
             <ProfileAction buildConfiguration = "Release" shouldUseLaunchSchemeArgsEnv = "YES" savedToolIdentifier = "" useCustomWorkingDirectory = "NO" debugDocumentVersioning = "YES">
             </ProfileAction>
             <AnalyzeAction buildConfiguration = "Debug">
             </AnalyzeAction>
             <ArchiveAction buildConfiguration = "Release" revealArchiveInOrganizer = "YES">
             </ArchiveAction>
          </Scheme>
          EOF
          ls -la ios/App "$SCHEME_DIR"

      - name: Add permission texts and build number
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'TapDine uses your location to show live food deals near you.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true

      - name: Write and check App Store Connect API key
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in PRIVATE_KEY KEY_ID ISSUER_ID; do
            [ -n "${!v}" ] || { echo "::error::Missing secret for $v"; exit 1; }
          done
          # fastlane takes the team ID from Apple's provisioning profile; the
          # secret is only cross-checked, so a typo here no longer breaks builds.
          [[ "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || echo "::warning::APPLE_TEAM_ID should be exactly 10 capital letters/digits (it contains other characters). The build will use the team ID from Apple's profile instead."
          mkdir -p "$RUNNER_TEMP/keys"
          KEYFILE="$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          # Accept keys pasted with real newlines or with literal \n sequences.
          printf '%b\n' "$PRIVATE_KEY" | tr -d '\r' > "$KEYFILE"
          grep -q "BEGIN PRIVATE KEY" "$KEYFILE" || { echo "::error::Private key must include the BEGIN/END PRIVATE KEY lines"; exit 1; }
          openssl pkey -in "$KEYFILE" -noout || { echo "::error::Private key is not a valid .p8 file"; exit 1; }

      - name: Install fastlane
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          export PATH="/opt/homebrew/bin:$PATH"
          brew install fastlane || brew upgrade fastlane

      # Signing, build, upload: see fastlane/Fastfile. Plain xcodebuild export
      # failed with "No Accounts with App Store Connect Access" because Xcode
      # cloud signing needs a signed-in Xcode account, which CI doesn't have.
      # fastlane creates a temporary distribution cert + App Store profile via
      # the API key, builds a signed IPA, uploads it, then revokes the cert.
      - name: Sign, build & upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          export ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          fastlane ios beta

      # If the build stops early, print the tail of gym's log plus the exact
      # error lines, so the cause is visible without flooding the console.
      - name: Print build errors on failure
        if: failure()
        run: |
          echo "=== Gym Log Tail (Last 150 lines) ==="
          tail -n 150 ~/Library/Logs/gym/*.log 2>/dev/null || true
          echo "=== Filtered Errors from Log ==="
          grep -i -C 2 "error:" ~/Library/Logs/gym/*.log 2>/dev/null || true

      - name: Clean up key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
