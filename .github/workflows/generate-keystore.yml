# Generate the TapDine Android upload keystore in the cloud.
# Trigger: GitHub → Actions → "Generate Android upload keystore" → Run workflow,
# enter a strong password, then download the "tapdine-keystore-artifact".
# The artifact holds your signing key and password: download it, store it
# somewhere safe (e.g. a password manager), add the secrets, then delete the
# artifact from the run page. Losing this key means you can't update the app
# on Google Play without a key reset.

name: Generate Android upload keystore

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        type: string
        required: true
        description: "Password for the keystore"

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Mask password in logs
        run: |
          PW=$(jq -r '.inputs.keystore_password' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$PW"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate keystore
        env:
          KS_PASSWORD: ${{ github.event.inputs.keystore_password }}
        run: |
          if [ ${#KS_PASSWORD} -lt 6 ]; then
            echo "::error::Keystore password must be at least 6 characters."; exit 1
          fi
          keytool -genkeypair -v \
            -keystore tapdine-upload.jks \
            -alias tapdine \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storetype JKS \
            -storepass "$KS_PASSWORD" -keypass "$KS_PASSWORD" \
            -dname "CN=TapDine, OU=Mobile, O=TapDine, L=Brighton, ST=Sussex, C=GB"

      - name: Prepare output files
        env:
          KS_PASSWORD: ${{ github.event.inputs.keystore_password }}
        run: |
          mkdir -p keystore-out
          cp tapdine-upload.jks keystore-out/
          base64 -w 0 tapdine-upload.jks > keystore-out/ANDROID_KEYSTORE_BASE64.txt
          printf '%s' "tapdine" > keystore-out/ANDROID_KEY_ALIAS.txt
          printf '%s' "$KS_PASSWORD" > keystore-out/ANDROID_KEYSTORE_PASSWORD.txt
          printf '%s' "$KS_PASSWORD" > keystore-out/ANDROID_KEY_PASSWORD.txt
          cat > keystore-out/README_SECRETS.txt <<'EOF'
          TapDine Android upload keystore
          ===============================

          Add these 4 repository secrets in GitHub:
          Settings -> Secrets and variables -> Actions -> New repository secret

            ANDROID_KEYSTORE_BASE64   = contents of ANDROID_KEYSTORE_BASE64.txt
            ANDROID_KEYSTORE_PASSWORD = contents of ANDROID_KEYSTORE_PASSWORD.txt
            ANDROID_KEY_ALIAS         = contents of ANDROID_KEY_ALIAS.txt (tapdine)
            ANDROID_KEY_PASSWORD      = contents of ANDROID_KEY_PASSWORD.txt

          Paste each value exactly, with no extra spaces or line breaks.

          Then run "Build Android (AAB + test APK)" to get a signed .aab for Google Play.

          IMPORTANT:
          - Keep tapdine-upload.jks and the password safe (password manager / backup).
            Without them you cannot publish updates.
          - Delete this artifact from the GitHub run page once the secrets are saved.
          EOF
          sed -i 's/^          //' keystore-out/README_SECRETS.txt
          ls -la keystore-out

      - uses: actions/upload-artifact@v4
        with:
          name: tapdine-keystore-artifact
          path: keystore-out/
          retention-days: 1

      - name: Clean up
        if: always()
        run: rm -f tapdine-upload.jks
